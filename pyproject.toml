[project]
name = "inventory-optimizer"
version = "0.1.0"
description = "Producto de datos de pronóstico de demanda y optimización de inventario, primero en Python, con ingesta de FreshRetailNet-50K."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Opcional: streaming acotado en vivo vía datasets.load_dataset de Hugging Face.
# La ingesta offline, las pruebas y los imports nunca requieren este paquete.
streaming = ["datasets>=3.0"]

# Opcional: visor de benchmark de Streamlit de solo lectura (app/streamlit_app.py).
# El runtime central, las pruebas y los imports nunca requieren este paquete.
demo = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
